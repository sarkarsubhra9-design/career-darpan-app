
name: Build Career Darpan APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Career_Darpan_Mobile_Build_Source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android source
        run: unzip -q Career_Darpan_Mobile_Build_Source.zip -d source

      - name: Align Java and Kotlin JVM targets
        working-directory: source/CareerDarpan_Full_Source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text()
          old = "android {\n    namespace 'com.careerdarpan.app'"
          new = """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              namespace 'com.careerdarpan.app'"""
          if old not in s:
              raise SystemExit('Could not locate android block in app/build.gradle')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build debug APK
        working-directory: source/CareerDarpan_Full_Source
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Career-Darpan-APK
          path: source/CareerDarpan_Full_Source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
